name: Eagles Nest CI

on:
  push:
    branches: [Dev, Test, Prod]
  pull_request:
    branches: [Dev, Test, Prod]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: EaglesNest_CI_2026!
        ports:
          - 1433:1433
    env:
      EAGLESNEST_TEST_CONNECTION: Server=localhost,1433;Database=EaglesNest_IntegrationTests;User Id=sa;Password=EaglesNest_CI_2026!;Encrypt=True;TrustServerCertificate=True

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore EaglesNest.slnx

      - name: Build
        run: dotnet build EaglesNest.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EaglesNest.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
